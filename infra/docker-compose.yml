services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: taskifynote
      POSTGRES_USER: taskifynote
      POSTGRES_PASSWORD: taskifynote
    ports: ["5432:5432"]
    volumes: [taskifynote_pg:/var/lib/postgresql/data]
  api:
    build: ../apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://taskifynote:taskifynote@postgres:5432/taskifynote
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [postgres]
volumes:
  taskifynote_pg:
