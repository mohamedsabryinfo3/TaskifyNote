name: Restore TaskifyNote source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/taskifynote.zip
          rm -rf /tmp/taskifynote
          mkdir -p /tmp/taskifynote
          unzip -q /tmp/taskifynote.zip -d /tmp/taskifynote
          cp -a /tmp/taskifynote/. .
          rm -rf .bootstrap /tmp/taskifynote /tmp/taskifynote.zip
      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TaskifyNote Builder"
          git config user.email "339280546+mohamedsabryinfo3@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: restore TaskifyNote source"
          git push
